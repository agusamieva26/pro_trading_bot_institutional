 # fly.toml file generated for pro-trading-bot-institutional
 
 app = "pro-trading-bot-institutional"
 primary_region = "mad" # Madrid, puedes cambiarlo a una región más cercana a ti o a tus servicios.
 
 [build]
   dockerfile = "Dockerfile"
 
 [http_service]
   internal_port = 8080 # Puerto del health check
   force_https = true
   auto_stop_machines = false # El bot debe correr 24/7
   auto_start_machines = true
   min_machines_running = 1
 
   # Health check para que Fly.io sepa que el bot está vivo.
   [[http_service.checks]]
     interval = "15s"
     timeout = "10s"
     grace_period = "1m" # Darle tiempo al bot para que inicie
     method = "GET"
     path = "/health"
     protocol = "http"
 
 # Mapeo para el dashboard de Streamlit
 [[services]]
   protocol = "tcp"
   internal_port = 5000 # Puerto interno de Streamlit
   
   [[services.ports]]
     port = 10000 # Puerto público para acceder al dashboard (ej: https://<app-name>.fly.dev:10000)
     handlers = ["http"]
     force_https = true