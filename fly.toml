# fly.toml app configuration file generated for ai-trading-bot
app = "ai-trading-bot"
primary_region = "iad"
console_command = "/app/bin/console"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  MODE = "paper"
  LOG_LEVEL = "INFO"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Resource allocation for trading bot
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Keep the bot running 24/7
[[processes]]
  [processes.app]
    cmd = ["python", "-u", "-m", "bot.main"]
    entrypoint = []

# Health checks
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"