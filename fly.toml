# fly.toml app configuration file generated for ai-trading-bot
app = "ai-trading-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  MODE = "paper"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8501 # Puerto del dashboard Streamlit
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    port = 8080 # Puerto del health_server.py
    grace_period = "30s"

# Resource allocation for trading bot
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Keep the bot running 24/7
[[processes]]
  app = "python -u start_and_monitor.py"